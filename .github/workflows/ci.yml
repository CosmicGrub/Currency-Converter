name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, Lint & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps: typescript-eslint@8.68.0's declared peer range
      # for `typescript` is ">=4.8.4 <6.1.0", which doesn't cover this
      # project's TypeScript 7.x -- npm's strict (default) peer resolver
      # refuses to install at all otherwise. See scripts/
      # link-eslint-typescript-compat.mjs (a postinstall step, runs
      # automatically below) for how ESLint tooling still gets a
      # supported TypeScript version without touching the project's real
      # TS 7 toolchain (tsc/vite, both run unaffected by any of this).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    name: Production build & bundle size
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps: typescript-eslint@8.68.0's declared peer range
      # for `typescript` is ">=4.8.4 <6.1.0", which doesn't cover this
      # project's TypeScript 7.x -- npm's strict (default) peer resolver
      # refuses to install at all otherwise. See scripts/
      # link-eslint-typescript-compat.mjs (a postinstall step, runs
      # automatically below) for how ESLint tooling still gets a
      # supported TypeScript version without touching the project's real
      # TS 7 toolchain (tsc/vite, both run unaffected by any of this).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (vite build)
        run: npm run build

      - name: Enforce bundle size budget
        run: npm run size-check

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  android:
    name: Android build (app + wear)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps: typescript-eslint@8.68.0's declared peer range
      # for `typescript` is ">=4.8.4 <6.1.0", which doesn't cover this
      # project's TypeScript 7.x -- npm's strict (default) peer resolver
      # refuses to install at all otherwise. See scripts/
      # link-eslint-typescript-compat.mjs (a postinstall step, runs
      # automatically below) for how ESLint tooling still gets a
      # supported TypeScript version without touching the project's real
      # TS 7 toolchain (tsc/vite, both run unaffected by any of this).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app (dist/)
        run: npm run build

      - name: Sync web build into the Capacitor Android shell
        run: npx cap sync android

      # Capacitor 8's generated android/app/capacitor.build.gradle sets
      # sourceCompatibility/targetCompatibility to JavaVersion.VERSION_21 --
      # the Gradle JVM has to be at least JDK 21 to compile that (a JVM can
      # target older bytecode than itself, never newer). The :wear module
      # separately targets JDK 17 bytecode, which JDK 21 compiles down to
      # fine, so one JDK version covers both modules.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Installs/updates Android cmdline-tools and accepts all SDK
      # licenses non-interactively -- without this, Gradle's on-demand
      # download of compileSdk/targetSdk 36 (see android/variables.gradle)
      # can fail CI with "You have not accepted the license agreements"
      # even when a base SDK is already preinstalled on the runner image.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # android/gradlew is checked in without the executable bit (mode
      # 100644), so a fresh checkout can't run it directly.
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Builds both real modules that ship from this repo -- :app covers
      # every phone/tablet device (Fold5 flex mode + hinge plugin, Galaxy
      # Tab's extra-wide tier, and every other device all build from this
      # one unified module as of v1.5.0), :wear is the separate Watch6
      # Classic companion with its own applicationId. This is the actual
      # compile verification the native code has never had -- everything
      # here was previously written and reviewed in a sandbox with no
      # Android SDK and no network access to dl.google.com, so it was
      # never run through a real Gradle build before landing on main.
      - name: Build phone/tablet app (:app)
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Wear OS companion (:wear)
        working-directory: android
        run: ./gradlew :wear:assembleDebug --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/debug/*.apk
          retention-days: 7

  # These two jobs run each app on a real (emulated) Android/Wear OS
  # runtime, not just compiling it -- the "android" job above only proves
  # javac/kotlinc accept the code, which is a real, necessary check (it
  # caught 5 genuine bugs the first week this CI existed -- see
  # docs/DEVICE_FOLD5.md and docs/DEVICE_WATCH6_CLASSIC.md) but doesn't
  # prove any of it actually *runs* without crashing. Neither job can
  # reach real hardware-specific behavior (an actual hinge-angle change
  # on a folding screen, a physical rotary bezel, a real always-on
  # display) -- see docs/DEVICE_VERIFICATION_CHECKLIST.md for exactly
  # what's still unverified and needs a real device or a full Android
  # Studio emulator session for that reason. What these jobs do prove:
  # the exact native code CI's compile check can't reach the runtime
  # behavior of -- FoldStatePlugin's WindowInfoTracker wiring, and Wear
  # MainActivity's AmbientModeSupport.attach() -- actually initializes
  # and runs without throwing, on a real Android runtime.
  instrumented-app:
    name: Instrumented emulator test (:app)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app (dist/)
        run: npm run build

      - name: Sync web build into the Capacitor Android shell
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # GitHub's Linux runners support hardware-accelerated (KVM) Android
      # emulators, but the kvm device node's default permissions don't
      # allow the runner user to use it -- this udev rule fixes that.
      # Without it the emulator falls back to software rendering, which
      # is dramatically slower and can time out in CI.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # api-level 34 / google_apis / x86_64: a standard, broadly-available
      # profile (not a foldable one -- see the job-level comment above for
      # why that's a real, documented scope boundary, not an oversight).
      # x86_64 matches the runner's own CPU architecture, required for KVM
      # acceleration to actually engage.
      # `working-directory:` isn't an input this action reads (its script
      # runs from the workflow's own default cwd, not a step-level
      # property some actions honor and others don't) -- `cd android &&`
      # inside the script itself is the one guaranteed-correct way to run
      # gradlew from the right place here.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-instrumented-test-report
          path: android/app/build/reports/androidTests/connected
          retention-days: 7

  instrumented-wear:
    name: Instrumented emulator test (:wear)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4

      # :wear itself has no dependency on the web build -- it's a
      # standalone Kotlin module with its own applicationId, not
      # wrapped/generated by Capacitor. But this job's first real run
      # failed anyway: "MissingResourceException: Could not read script
      # '.../capacitor-cordova-android-plugins/cordova.variables.gradle'
      # as it does not exist" -- Gradle configures every subproject in
      # settings.gradle (:app, :wear, :capacitor-cordova-android-plugins)
      # up front, even for a task scoped to just :wear, and :app's
      # Capacitor-generated build script references a path that only
      # exists after `npx cap sync android` populates it. So this job
      # needs the same web-build + sync steps as "android"/
      # "instrumented-app" after all -- not because :wear's own code
      # needs them, but because the multi-project Gradle build as a
      # whole does.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web app (dist/)
        run: npm run build

      - name: Sync web build into the Capacitor Android shell
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # api-level 33, not :wear's own minSdkVersion 30 -- CI's first real
      # run here failed with "Failed to find package 'system-images;
      # android-30;android-wear;x86_64'": that exact image doesn't exist
      # in the SDK repository (not every API level ships every target).
      # 33 ("Wear OS 4 Intel x86_64 Atom System Image") does, confirmed
      # against Google's own SDK package listing, not guessed a second
      # time -- still well above minSdkVersion 30, so nothing about the
      # module itself needs to change to run on it. android-wear is this
      # action's documented Wear OS system image tag (distinct from
      # android-tv/google-tv/automotive, its other non-phone targets).
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          script: cd android && ./gradlew :wear:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-instrumented-test-report
          path: android/wear/build/reports/androidTests/connected
          retention-days: 7
