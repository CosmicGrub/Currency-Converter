apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.cosmicgrub.exchangeboard.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.cosmicgrub.exchangeboard.wear"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        // Watch6 Classic branch (device/galaxy-watch6-classic) -- rotary
        // bezel input, ambient mode, and a watch-face complication added
        // on top of the original Tile + companion activity.
        versionName "1.0-watch6classic"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear.tiles:tiles:1.2.0'
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    implementation 'com.google.guava:guava:33.2.1-android'

    // Watch6 Classic branch additions -- ambient/always-on-display support
    // and watch-face complications. Stable, long-established artifacts,
    // but pin versions couldn't be double-checked against the current
    // Google Maven index from the sandbox this was authored in
    // (dl.google.com wasn't reachable there) -- verify the latest stable
    // versions in Android Studio before building.
    implementation 'androidx.wear:wear-ambient:1.0.1'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
}
