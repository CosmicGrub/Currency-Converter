apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.cosmicgrub.exchangeboard.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.cosmicgrub.exchangeboard.wear"
        minSdkVersion 30
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        // Watch6 Classic branch (device/galaxy-watch6-classic) -- rotary
        // bezel input, ambient mode, and a watch-face complication added
        // on top of the original Tile + companion activity.
        versionName "1.0-watch6classic"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear.tiles:tiles:1.2.0'
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
    implementation 'com.google.guava:guava:33.2.1-android'

    // Watch6 Classic branch addition -- watch-face complications.
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.2.1'
    // Ambient/always-on-display support (AmbientModeSupport, package
    // androidx.wear.ambient) needs no separate dependency -- it's part of
    // androidx.wear:wear itself (above), not a standalone "wear-ambient"
    // artifact. That artifact never existed on Maven: CI's first real
    // build failed with "Could not find androidx.wear:wear-ambient:1.0.1"
    // -- a bad guess made without dl.google.com access in the sandbox
    // this branch was originally authored in.
}
